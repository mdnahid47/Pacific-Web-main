# Tuned for a 7 GB RAM machine — do NOT use -Xmx8G here
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Serialize the build to avoid multiple JVMs competing for RAM
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false

android.useAndroidX=true

