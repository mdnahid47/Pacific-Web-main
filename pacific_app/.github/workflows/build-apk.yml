name: Build APK

on:
  push:
    branches: [ main ] # অথবা আপনার প্রধান ব্রাঞ্চের নাম
  workflow_dispatch: # ম্যানুয়ালি ট্রিগার করার অনুমতি দেয়

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # আপনার প্রজেক্ট Java 17 ব্যবহার করছে

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # আপনি আপনার লোকাল Flutter সংস্করণ নির্দিষ্ট করতে পারেন, যেমন '3.41.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk